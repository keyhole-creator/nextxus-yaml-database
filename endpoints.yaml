# ── How to Connect (Quick Reference) ──────────────────────────────────────────
how_to_connect:
  plain_html_fetch: |
    <!-- Load any YAML file from the Federation in plain HTML -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script>
      fetch('https://cdn.jsdelivr.net/gh/keyhole-creator/nextxus-yaml-database@main/directives.yaml')
        .then(r => r.text())
        .then(text => {
          const data = jsyaml.load(text);
          console.log(data);
        });
    </script>

  universal_loader: |
    <!-- Universal loader: one tag connects to everything -->
    <script src="https://cdn.jsdelivr.net/gh/keyhole-creator/nextxus-yaml-database@main/loader.js"></script>
    <script>
      NextXus.load('directives').then(data => console.log(data));
    </script>

  embed_widget: |
    <!-- Embed the full widget (Directives + Messages) on any site -->
    <script src="https://keyhole-creator.github.io/nextxus-yaml-database/widget.js"></script>

  discover_endpoints: |
    <!-- Start here: read this file to know all URLs -->
    fetch('https://cdn.jsdelivr.net/gh/keyhole-creator/nextxus-yaml-database@main/endpoints.yaml')

