# NextXus Federation — Universal Endpoint Manifest
# ============================================================
# This file is the master key to the entire database.
# Any host, any service, any HTML page can read this one file
# to discover where every piece of the Federation lives.
#
# Two mirrors for every file:
#   github_raw  — the canonical source (GitHub)
#   jsdelivr    — free global CDN mirror (no setup needed)
#
# If GitHub is slow, use jsDelivr. If jsDelivr is slow, use GitHub.
# Both are free. Both serve the same data.
#
# To use from any HTML page:
#   fetch('https://cdn.jsdelivr.net/gh/keyhole-creator/nextxus-yaml-database@main/endpoints.yaml')
#
# "Fork it. Use it. Give it away." — Roger Keyserling

